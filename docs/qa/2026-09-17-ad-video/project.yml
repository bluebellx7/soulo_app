name: SouloAdVideoQA
options:
  deploymentTarget:
    iOS: '17.0'
targets:
  QAHost:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.soulo.advideo.qa
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  QA:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: QAHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.soulo.advideo.qa.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: QAHost
schemes:
  QA:
    build:
      targets:
        QAHost: all
        QA: [test]
    test:
      targets: [QA]
