<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频续播测试</title><style>body{font:20px -apple-system;margin:16px}video{width:100%;height:230px;background:#111}button{padding:12px}</style><h2>视频快捷操作测试</h2><video id="v" muted playsinline controls src="video.mp4"></video><p id="status">准备播放</p><button onclick="v.currentTime=8;v.play()">跳到8秒</button><a href="interaction.html" target="_blank">切到新标签</a><script>if(location.search.includes('tabs'))v.src='video-long.mp4';setInterval(()=>document.getElementById('status').textContent='进度 '+v.currentTime.toFixed(1)+' 倍速 '+v.playbackRate+' 暂停 '+v.paused,200)</script>
<p id="animation"></p><script>
window.addEventListener('click',e=>{
 if(!e.target.closest('[data-video-toggle]'))return;
 const group=e.target.closest('[data-soulo-video-rotate]');const values=[];let samples=0;
 const record=()=>{values.push(group.getBoundingClientRect().width);if(++samples<24)requestAnimationFrame(record);else document.getElementById('animation').textContent='动画中间帧 '+values.filter(w=>w>37&&w<143).length};requestAnimationFrame(record)
},true);
</script>
