  <title>窗边小憩</title>
  <style>
    :root { color-scheme: light; background: #f4ebe1; color: #3d302c; font: 16px/1.35 system-ui,sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main {
      min-height: 100dvh; display: grid; place-content: center; justify-items: center;
      padding: max(env(safe-area-inset-top),12px) 18px max(env(safe-area-inset-bottom),22px);
    }
    .portrait {
      display: block; width: min(90vw, 460px, 59dvh); aspect-ratio: 1; object-fit: cover;
      -webkit-mask: radial-gradient(ellipse 76% 71% at 50% 46%,#000 51%,#0000 75%);
      mask: radial-gradient(ellipse 76% 71% at 50% 46%,#000 51%,#0000 75%);
    }
    form {
      min-height: 52px; width: min(100vw - 36px, 425px); max-width: 100%;
      margin-top: -12px; display: flex; align-items: center; padding-inline: 16px 4px;
      background: #fff9efd9; border: 1px solid #553e322d; border-radius: 100px;
      box-shadow: 0 8px 22px #6d483a12; z-index: 1;
    }
    form:focus-within { border-color: #935f74; }
    input, button { color: inherit; font: inherit; -webkit-tap-highlight-color: transparent; }
    input { appearance: none; outline: none; border: 0; background: transparent; min-width: 0; flex: 1; width: 100%; }
    input::placeholder { color: #6d5550; }
    button {
      width: 44px; height: 44px; flex: none; border: 0; border-radius: 50%;
      color: #684459; background: transparent; cursor: pointer; font-size: 1.25rem;
    }
    button:active { background: #66425517; }
    button:focus-visible { outline: 2px solid #935f74; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
  </style>

      <label class="sr-only" id="caption" for="query">搜索或输入网址</label>
      <input id="query" type="search" placeholder="搜索或输入网址" enterkeyhint="search" autocomplete="off" required>

  <script>
    const input = document.getElementById('query');
    const form = document.querySelector('form');
    if (!(navigator.language || 'zh-Hans').startsWith('zh')) {
      document.documentElement.lang = 'en';
      document.title = 'Window Seat';
      input.placeholder = 'Search or enter a website';
      document.getElementById('caption').textContent = input.placeholder;
      form.querySelector('button').setAttribute('aria-label','Search');
    }
    form.addEventListener('submit', event => {
      event.preventDefault();
      const query = input.value.trim();
      if (query) window.Soulo?.search(query);
    });
  </script>
