<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今日清单</title>
<style>

:root { color-scheme: light; color: var(--ink); background: var(--paper); font: 16px/1.45 system-ui,sans-serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100dvh; padding: var(--top) 18px max(22px,env(safe-area-inset-bottom)); color: var(--ink); }
main { width: min(100%,var(--measure,660px)); margin-inline: auto; }
button,input,textarea { font:inherit; color:inherit; min-width:0; }
button { cursor:pointer; }
a { color:inherit; }
button:focus-visible,a:focus-visible,textarea:focus-visible { outline: 2px solid var(--accent); outline-offset:3px; }
h1,h2,p,ul { margin:0; }
h2 { font-size:1rem; }
ul { list-style:none; padding:0; }
.search { display:flex; align-items:center; min-height:50px; gap:8px; min-width:0; }
.search input { appearance:none; flex:1; width:100%; border:0; padding:10px 0; background:none; outline:none; box-shadow:none; }
.search input::placeholder { color:var(--muted); }
.search button { flex:none; min-width:44px; min-height:44px; border:0; background:none; color:var(--accent); }
.list li { min-width:0; }
.list a,.list button { display:flex; text-align:start; gap:9px; align-items:center; min-height:44px; width:100%; text-decoration:none; overflow:hidden; }
.list button { border:0; background:none; padding:0; }
.list .label { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.list .initial { display:grid; place-items:center; width:30px; height:30px; flex:none; }
.sr { position:absolute; width:1px; height:1px; clip:rect(0,0,0,0); overflow:hidden; white-space:nowrap; }
.empty { color:var(--muted); font-size:.86rem; }

:root { --top: calc(env(safe-area-inset-top) + 52px); }

:root { --paper:#f7e9d7; --ink:#432d29; --muted:#735b4e; --accent:#a13e31; --measure:540px; }
header { display:flex; align-items:baseline; justify-content:space-between; border-bottom:2px solid #a64736; margin-bottom:8px; gap:10px; flex-wrap:wrap; }
h1 { font-family:"Songti SC",Georgia,serif; font-size:clamp(1.8rem,7vw,2.8rem); }
time { font-size:.82rem; color:var(--muted); }
.search { border-bottom:1px solid #a58a76; margin-bottom:22px; }
.sheet { background:#fff8ec; padding:12px 14px 9px; border-left:3px solid #d66c51; }
#tasks { margin:6px 0; }
#tasks li { display:flex; align-items:center; justify-content:space-between; min-height:48px; border-bottom:1px solid #dbcbc0; gap:8px; }
#tasks label { flex:1; min-width:0; display:flex; align-items:center; gap:8px; overflow-wrap:anywhere; }
#tasks input { accent-color:var(--accent); flex:none; }
#tasks input:checked+span { text-decoration:line-through; color:var(--muted); }
#tasks button,#task-form button { border:0; background:none; min-width:44px; min-height:44px; color:var(--accent); }
#task-form { display:flex; gap:5px; }
#task-form input { flex:1; width:100%; border:0; border-bottom:1px solid #b49a83; background:none; }

</style>
</head>
<body>
<main><header><h1>今日清单</h1><time id="today"></time></header>
<form class="search" role="search"><label class="sr" for="query">搜索或输入网址</label>
<input id="query" type="search" placeholder="搜索或输入网址" autocomplete="off" enterkeyhint="search" required>
<button aria-label="搜索">→</button></form>

<section class="sheet"><h2>待办</h2><ul id="tasks"></ul><form id="task-form">
<label for="task" class="sr">添加待办</label><input id="task" maxlength="90" placeholder="添加待办" required><button aria-label="添加">+</button></form></section></main>
<script>

const $ = selector => document.querySelector(selector);
const bridge = window.Soulo;
const mainSearch = $('.search');
const query = mainSearch?.querySelector('input');
mainSearch?.addEventListener('submit', event => {
  event.preventDefault();
  const value = query.value.trim();
  if (value) bridge?.search(value);
});
document.addEventListener('pointerdown', event => {
  if (mainSearch && !mainSearch.contains(event.target)) query.blur();
});
document.querySelectorAll('[data-soulo-action]').forEach(button => {
  button.addEventListener('click', () => bridge?.perform(button.dataset.souloAction));
});
function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
function records(kind) {
  const context = bridge?.getContext() ?? {};
  const source = kind === 'bookmarks' ? context.bookmarks : context.recentSearches;
  return Array.isArray(source) ? source : [];
}
function fill(selector, kind, options = {}) {
  const list = $(selector);
  if (!list) return;
  const needle = (options.needle ?? '').trim().toLowerCase();
  const rows = records(kind).flatMap(item => {
    const bookmark = typeof item !== 'string';
    if (bookmark && !item) return [];
    const title = (bookmark ? item.title : item) || (bookmark ? item.url : '');
    if (typeof title !== 'string' || !title.toLowerCase().includes(needle) && !String(item.url ?? '').toLowerCase().includes(needle)) return [];
    const action = element(bookmark ? 'a' : 'button');
    if (bookmark) {
      let target;
      try { target = new URL(item.url); } catch { return []; }
      if (!['https:', 'http:'].includes(target.protocol) || target.username || target.password) return [];
      action.href = target.href;
    } else {
      action.type = 'button';
      action.addEventListener('click', () => bridge?.search(title));
    }
    if (options.initial) action.append(element('span','initial',Array.from(title)[0]?.toUpperCase() ?? '·'));
    action.append(element('span','label',title));
    const li = element('li');
    li.append(action);
    return [li];
  }).slice(0, options.limit ?? 8);
  if (rows.length) list.replaceChildren(...rows);
  else list.replaceChildren(element('li','empty',needle ? '没有匹配结果' : kind === 'bookmarks' ? '收藏会出现在这里' : '还没有最近搜索'));
}
function stored(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) ?? 'null') ?? fallback; } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}


$('#today').textContent = new Date().toLocaleDateString(navigator.language,{month:'short',day:'numeric'});
const key = 'soulo.today-list.tasks.v1';
const initial = stored(key, []);
let tasks = Array.isArray(initial) ? initial.filter(item => item && typeof item.title === 'string').slice(0,20) : [];
function persist() { save(key,tasks); }
function render() {
  $('#tasks').replaceChildren(...tasks.map((task,index) => {
    const row = element('li'), label = element('label'), box = element('input'), remove = element('button','','×');
    box.type = 'checkbox'; box.checked = task.done === true;
    label.append(box,element('span','',task.title));
    box.addEventListener('change',() => { task.done = box.checked; persist(); });
    remove.type = 'button';
    remove.setAttribute('aria-label','删除 '+task.title);
    remove.addEventListener('click',() => { tasks.splice(index,1); persist(); render(); });
    row.append(label,remove);
    return row;
  }));
}
$('#task-form').addEventListener('submit', event => {
  event.preventDefault();
  const field = $('#task'), title = field.value.trim();
  if (!title || tasks.length >= 20) return;
  tasks.push({title,done:false}); field.value = ''; persist(); render();
});
render();

</script>
</body>
</html>
