name: Soulo
options:
  bundleIdPrefix: com.dkluge
  deploymentTarget:
    iOS: "17.0"
  knownRegions:
    - ar-SA
    - bn-BD
    - ca
    - zh-Hans
    - zh-Hant
    - hr
    - cs
    - da
    - nl-NL
    - en-AU
    - en-CA
    - en-GB
    - en-US
    - fi
    - fr-FR
    - fr-CA
    - de-DE
    - el
    - gu-IN
    - he
    - hi
    - hu
    - id
    - it
    - ja
    - kn-IN
    - ko
    - ms
    - ml-IN
    - mr-IN
    - no
    - or-IN
    - pl
    - pt-BR
    - pt-PT
    - pa-IN
    - ro
    - ru
    - sk
    - sl-SI
    - es-MX
    - es-ES
    - sv
    - ta-IN
    - te-IN
    - th
    - tr
    - uk
    - ur-PK
    - vi
    - Base

targets:
  Soulo:
    type: application
    platform: iOS
    sources:
      - Soulo/Source
      - Soulo/Assets.xcassets
      - Soulo/PrivacyInfo.xcprivacy
      - path: Soulo/Resources/UserScripts
        type: folder
        buildPhase: resources
      - path: Soulo
        includes:
          - "*.lproj"
        buildPhase: resources
    info:
      path: Soulo/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSUserActivityTypes:
          - com.dkluge.Soulo.browsing
        CFBundleDisplayName: Soulo
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen:
          UIColorName: LaunchScreenColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Allow camera access when you approve a website request, such as for video calls, scanning codes, or taking a photo."
        NSMicrophoneUsageDescription: "Allow microphone access for voice search and, when you approve, website calls or recording."
        NSSpeechRecognitionUsageDescription: "Allow speech recognition to turn your voice into search text."
        NSPhotoLibraryUsageDescription: "Soulo needs photo library access to set a custom wallpaper."
        NSPhotoLibraryAddUsageDescription: "Soulo needs permission to save web images to your photo library."
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: "Transfer files with your computer while Wi-Fi Transfer is open."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Soulo Documents
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
              - org.idpf.epub-container
              - public.text
              - public.rtf
              - public.html
              - public.xml
              - public.json
              - public.comma-separated-values-text
              - public.tab-separated-values-text
              - net.daringfireball.markdown
              - public.image
              - public.movie
              - public.audio
              - public.zip-archive
              - com.dkluge.soulo.ebook
              - com.dkluge.soulo.archive
              - org.openxmlformats.wordprocessingml.document
              - org.openxmlformats.spreadsheetml.sheet
              - org.openxmlformats.presentationml.presentation
              - com.microsoft.word.doc
              - com.microsoft.excel.xls
              - com.microsoft.powerpoint.ppt
              - com.apple.iwork.pages.pages
              - com.apple.iwork.numbers.numbers
              - com.apple.iwork.keynote.key
              - com.rarlab.rar-archive
              - org.7-zip.7-zip-archive
              - com.amazon.mobi8-ebook
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.dkluge.soulo.ebook
            UTTypeDescription: Mobipocket eBook
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [mobi, azw, azw3, azw4, prc, pdb]
          - UTTypeIdentifier: com.dkluge.soulo.archive
            UTTypeDescription: Compressed Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [rar, 7z]
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - soulo
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSExceptionDomains:
            delivery.mp.microsoft.com:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dkluge.Soulo
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Soulo/Soulo.entitlements
        DEVELOPMENT_TEAM: 7S2LBJA9VA
        MARKETING_VERSION: "1.1.7"
        CURRENT_PROJECT_VERSION: 25
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
    dependencies:
      - target: SouloWidgetExtension
      - target: SouloShareExtension
      - package: PLzmaSDK
      - package: Unrar
      - package: ZipArchive
        product: ZipArchive
      - package: DKlugeKit
        product: DKlugeCore
      - package: DKlugeKit
        product: DKlugeFeedback
      - package: DKlugeKit
        product: DKlugeI18n
      - package: DKlugeKit
        product: DKlugeTheme

  SouloWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SouloWidget
        excludes:
          - Info.plist
          - SouloWidget.entitlements
      - path: Soulo/Source/Shared/SouloSharedAction.swift
      - path: Soulo/Source/Shared/SouloSystemIntents.swift
    postBuildScripts:
      - name: Package extension localizations
        script: python3 "$SRCROOT/scripts/build_extension_localizations.py" SouloWidget
        basedOnDependencyAnalysis: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dkluge.Soulo.Widget
        CODE_SIGN_ENTITLEMENTS: SouloWidget/SouloWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7S2LBJA9VA
        MARKETING_VERSION: "1.1.7"
        CURRENT_PROJECT_VERSION: 25
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  SouloShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SouloShareExtension
        excludes:
          - SouloShareExtension.entitlements
      - path: Soulo/Source/Shared/SouloSharedAction.swift
    info:
      path: SouloShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Soulo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    postBuildScripts:
      - name: Package extension localizations
        script: python3 "$SRCROOT/scripts/build_extension_localizations.py" SouloShareExtension
        basedOnDependencyAnalysis: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dkluge.Soulo.ShareExtension
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: SouloShareExtension/SouloShareExtension.entitlements
        DEVELOPMENT_TEAM: 7S2LBJA9VA
        MARKETING_VERSION: "1.1.7"
        CURRENT_PROJECT_VERSION: 25
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  SouloTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SouloTests
        excludes:
          - ReadingFixtures
      - path: SouloTests/ReadingFixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Soulo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dkluge.Soulo.Tests
        GENERATE_INFOPLIST_FILE: "YES"

packages:
  ZipArchive:
    url: https://github.com/ZipArchive/ZipArchive.git
    revision: acc61be58181e635ae77718e66530b4ee7dea4be
  Unrar:
    url: https://github.com/mtgto/Unrar.swift.git
    revision: 7216007a38ac122dbdeae26cfdaf7f10775c868f
  PLzmaSDK:
    url: https://github.com/OlehKulykov/PLzmaSDK.git
    revision: 1b27a1c9df85805342d1b049427d6d1dc7ce713d
  DKlugeKit:
    path: ../DKlugeKit

schemes:
  Soulo:
    build:
      targets:
        Soulo: all
        SouloWidgetExtension: all
        SouloTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SouloTests
    archive:
      config: Release
