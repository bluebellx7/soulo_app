# Universal Link directly. Other clients can reach the same work on the web.
location ~* "^/custom-market/work/([0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/?$" {
    return 302 /custom-market.html?work=$1;
}
