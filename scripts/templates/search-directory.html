<!doctype html>
<html lang="zh-CN" data-theme="dark" data-resolved-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{page_title}}</title>
    <meta name="description" content="{{page_description}}" />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
    <meta name="theme-color" content="#111217" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <link rel="canonical" href="https://soulo.dkluge.com/{{kind}}.html" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg?v=20261030" />
    <link rel="apple-touch-icon" href="app-icon.png?v=1.1.4" />
    <link rel="alternate" type="text/plain" href="llms.txt" title="Soulo 网站摘要" />
    <meta property="og:site_name" content="Soulo" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="{{page_title}}" />
    <meta property="og:description" content="{{page_description}}" />
    <meta property="og:url" content="https://soulo.dkluge.com/{{kind}}.html" />
    <meta property="og:image" content="https://soulo.dkluge.com/app-icon.png?v=1.1.4" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Soulo 图标" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{page_title}}" />
    <meta name="twitter:description" content="{{page_description}}" />
    <meta name="twitter:image" content="https://soulo.dkluge.com/app-icon.png?v=1.1.4" />
    <meta name="twitter:image:alt" content="Soulo 图标" />
    <script>
      (() => {
        let theme = 'dark';
        try { const saved = localStorage.getItem('soulo-theme'); if (saved === 'light' || saved === 'dark') theme = saved; } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.resolvedTheme = theme;
      })();
    </script>
    <link rel="stylesheet" href="home.css" />
    <link rel="stylesheet" href="movies.css" />
    <link rel="stylesheet" href="content-directories.css" />
    <link rel="stylesheet" href="navigation.css" />
    <script type="application/ld+json">{{structured_data}}</script>
    <script id="directory-locales" type="application/json">{{page_locales}}</script>
    <script src="site-ui.js" defer></script>
    <script src="movies.js" defer></script>
    <noscript><style>.favorite-button,.directory-toolbar,.favorite-picks{display:none!important}</style></noscript>
    <script>
      var _hmt = _hmt || [];
      (function() {
        var hm = document.createElement("script");
        hm.src = "https://hm.baidu.com/hm.js?bdc8ea6c501e6ff0d7b16dc13b09b991";
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(hm, s);
      })();
    </script>
  </head>
  <body class="movies-page content-page search-directory-page {{kind}}-page" data-favorites-key="soulo-{{kind}}-favorites"{{legacy_favorites}}>
    <a class="skip-link" href="#directory" data-text-zh="跳到网站目录" data-text-en="Skip to the directory">跳到网站目录</a>
    {{navigation}}
    <main class="wrap">
      <nav class="breadcrumbs" aria-label="面包屑" data-label-zh="面包屑" data-label-en="Breadcrumb"><a href="./" data-page-i18n="breadcrumb.home">首页</a><span aria-hidden="true">/</span><span aria-current="page" data-page-i18n="directory.name">{{directory_name}}</span></nav>
      <header class="cinema-copy search-directory-intro">
        <h1 data-page-i18n="directory.name">{{directory_name}}</h1>
        <p data-text-zh="{{page_description}}" data-text-en="{{description_en}}">{{page_description}}</p>
      </header>
      <section class="favorite-picks" id="favorite-picks" hidden aria-labelledby="favorite-picks-title">
        <div class="directory-intro"><p id="favorite-picks-title">我的收藏</p></div>
        <div class="quick-picks" id="favorite-picks-grid"></div>
      </section>
      <div class="directory-toolbar" id="directory">
        <label class="movie-search">
          {{search_icon}}<span class="visually-hidden" data-page-i18n="directory.search">搜索网站、域名或关键词</span>
          <input type="search" id="movie-search" placeholder="搜索网站、域名或关键词" data-page-i18n-placeholder="directory.search" autocomplete="off" /><kbd aria-hidden="true">/</kbd>
        </label>
{{resource_groups}}
        <div class="directory-tabs" role="group" aria-label="收藏筛选" data-label-zh="收藏筛选" data-label-en="Favorites filter">
{{all_sites_button}}
          <button id="show-favorites" type="button" aria-pressed="false">{{heart_icon}}<span data-text-zh="收藏" data-text-en="Favorites">收藏</span><span id="favorite-count">0</span></button>
        </div>
      </div>
      <div class="directory-layout">
        <aside class="category-sidebar">
          <nav aria-label="网站分类" data-label-zh="网站分类" data-label-en="Website categories">
            <a class="category-link is-active" href="#directory" data-category="all" aria-current="true">{{grid_icon}}<span data-text-zh="全部分类" data-text-en="All categories">全部分类</span><span class="nav-count">{{site_count}}</span></a>
            {{category_links}}
          </nav>
        </aside>
        <div class="directory-results">
          <p class="results-meta" id="results-meta" role="status" aria-live="polite">共 {{site_count}} 个网站</p>
          {{catalog}}
          <div class="movie-empty" id="movie-empty" data-state="search" hidden>
            <img class="empty-illustration" src="images/web/illustration-bookmarks.webp" width="720" height="480" loading="lazy" decoding="async" alt="" aria-hidden="true" />
            <div>{{search_icon}}</div><h2 id="empty-title">没有找到匹配的网站</h2><p id="empty-description">试试名称、域名或分类。</p>
            <button type="button" id="reset-filters" data-text-zh="查看全部" data-text-en="View all">查看全部</button>
          </div>
        </div>
      </div>
    </main>
    <footer class="site-footer wrap"><div><a class="footer-brand" href="./">Soulo</a><span>© 2026 DKluge</span></div><div class="footer-links"></div></footer>
    <div class="movie-toast" id="movie-toast" role="status" aria-live="polite"></div>
  </body>
</html>
